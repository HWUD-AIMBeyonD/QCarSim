---
launch:

  - arg:
      name: config_dir
      default: ''
      description: Path to the common configuration directory.
  - arg:
      name: configuration
      default: basic
      description: Specify configuration package.
      choice:
        - value: basic
        - value: custom
  - arg:
      name: namespace
      default: $(env ROBOT_NAMESPACE '')
      description: Add namespace to all launched nodes.
  - arg:
      name: rviz
      default: 'True'
      description: Launch RViz2
      choice:
        - value: 'True'
        - value: 'False'

  - arg:
      name: x
      default: '0.0'
      description: Initial robot x position.
  - arg:
      name: y
      default: '0.0'
      description: Initial robot y position.
  - arg:
      name: z
      default: '0.0'
      description: Initial robot z position.
  - arg:
      name: roll
      default: '0.0'
      description: Initial robot roll orientation.
  - arg:
      name: pitch
      default: '0.0'
      description: Initial robot pitch orientation.
  - arg:
      name: yaw
      default: '0.0'
      description: Initial robot yaw orientation.

  - let:
      name: ns
      value: $(eval "('$(var namespace)/' if '$(var namespace)' else '')")
  - let:
      name: robot_name
      value: $(eval "('qcar' if '$(var namespace)' == '' else '$(var namespace)')")
  - let:
      name: qcar_gazebo_config
      value: $(eval "('$(var config_dir)/qcar_gazebo' if '$(var config_dir)' else '$(find-pkg-share
        qcar_gazebo)') + '/config'")
  - let:
      name: qcar_bridge_config
      value: /tmp/qcar_bridge_$(var namespace).yaml

  # Resolve namespace placeholder in bridge config
  - executable:
      cmd: bash -c "sed 's:<namespace>/:"$(var ns)":g' "$(var qcar_gazebo_config)/qcar_bridge.yaml"
        > "$(var qcar_bridge_config)""

  - log:
      message:
        "Spawning QCar\n
        \tNamespace: '$(var namespace)'\n
        \tInitial pose: ($(var x), $(var y), $(var z), $(var roll), $(var pitch), $(var yaw))"

  # Group all robot nodes to not leak namespace to other nodes
  - group:

      - push_ros_namespace:
          namespace: $(var namespace)

      - set_remap:
          from: /diagnostics
          to: diagnostics
      - set_remap:
          from: /tf
          to: tf
      - set_remap:
          from: /tf_static
          to: tf_static

      - set_parameter:
          name: use_sim_time
          value: 'True'

      # Per-robot Gazebo bridge (cmd_vel, odom, scan, imu, joint_states, tf)
      - node:
          pkg: ros_gz_bridge
          exec: parameter_bridge
          name: qcar_gz_bridge
          param:
            - name: config_file
              value: $(var qcar_bridge_config)

      # Spawn robot into Gazebo
      - node:
          pkg: ros_gz_sim
          exec: create
          args: >
            -name $(var robot_name)
            -allow_renaming True
            -topic robot_description
            -x $(var x)
            -y $(var y)
            -z $(var z)
            -R $(var roll)
            -P $(var pitch)
            -Y $(var yaw)

      # Load URDF via qcar_description
      - include:
          file: $(find-pkg-share qcar_controller)/launch/controller.yaml
          let:
            - name: configuration
              value: $(var configuration)
            - name: use_sim
              value: 'True'

      # Sensor component bridges (from husarion_components_description)
      - include:
          file: $(find-pkg-share husarion_components_description)/launch/gz_components.launch.py
          let:
            - name: components_config_path
              value: $(find-pkg-share qcar_description)/config/qcar/$(var configuration).yaml

      # EKF localization (QCar-specific config fusing /odom + /imu/data_raw)
      - node:
          pkg: robot_localization
          exec: ekf_node
          name: ekf
          param:
            - from: $(find-pkg-share qcar_controller)/config/qcar_localization/ekf.yaml
          remap:
            - from: /diagnostics
              to: diagnostics

      # Laser filter (filters self-hits from scan)
      - include:
          file: $(find-pkg-share rosbot_utils)/launch/laser_filter.yaml
          let:
            - name: robot_model
              value: rosbot

      # RViz
      - include:
          file: $(find-pkg-share qcar_description)/launch/rviz.yaml
          if: $(var rviz)
