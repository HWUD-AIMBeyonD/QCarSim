launch:

  - arg:
      name: config_dir
      default: ''
      description: Path to the common configuration directory.

  - set_env:
      name: RCUTILS_COLORIZED_OUTPUT
      value: '1'

  - set_env:
      name: GZ_SIM_RESOURCE_PATH
      value: $(find-pkg-share qcar_description)/..:$(find-pkg-share qcar_gazebo)/worlds:$(env GZ_SIM_RESOURCE_PATH '')
      
  - set_remap:
      from: /diagnostics
      to: diagnostics
      
  - set_remap:
      from: /tf
      to: tf
      
  - set_remap:
      from: /tf_static
      to: tf_static

  - set_parameter:
      name: use_sim_time
      value: 'True'

  - let:
      name: gz_bridge_config
      value: $(eval "('$(var config_dir)/qcar_gazebo' if '$(var config_dir)' else '$(find-pkg-share qcar_gazebo)') + '/config/gz_bridge.yaml'")

  - node:
      pkg: ros_gz_bridge
      exec: parameter_bridge
      name: gz_bridge
      param:
        - name: config_file
          value: $(var gz_bridge_config)

  - node:
      pkg: ros_gz_sim
      exec: gzserver
      name: gzserver
      param:
        - name: world_sdf_file
          value: $(find-pkg-share qcar_gazebo)/worlds/qcar_hwmap.sdf
        - name: use_sim_time
          value: true

  - executable:
      cmd: gz sim -g

  - include:
      file: $(find-pkg-share qcar_gazebo)/launch/spawn_qcar.yaml