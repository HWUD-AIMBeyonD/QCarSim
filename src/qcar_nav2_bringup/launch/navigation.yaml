launch:

  - arg:
      name: map
      default: /home/g16/Documents/qcarSim/s_map.yaml
      description: Full path to the map YAML file to load.

  - arg:
      name: use_sim_time
      default: 'True'
      description: Use simulation clock.
      choice:
        - value: 'True'
        - value: 'False'

  - arg:
      name: nav2_params
      default: $(find-pkg-share qcar_nav2_bringup)/config/nav2_params.yaml
      description: Path to Nav2 parameter file.

  - set_parameter:
      name: use_sim_time
      value: $(var use_sim_time)

  - set_remap:
      from: /tf
      to: tf
  - set_remap:
      from: /tf_static
      to: tf_static

  # ==================== Map Server ====================
  - node:
      pkg: nav2_map_server
      exec: map_server
      name: map_server
      param:
        - name: yaml_filename
          value: $(var map)

  # AMCL disabled — using ground truth map → odom from static_transform_publisher
  # - node:
  #     pkg: nav2_amcl
  #     exec: amcl
  #     name: amcl
  #     param:
  #       - from: $(var nav2_params)

  # ==================== Planner Server ====================
  - node:
      pkg: nav2_planner
      exec: planner_server
      name: planner_server
      param:
        - from: $(var nav2_params)

  # ==================== Controller Server ====================
  - node:
      pkg: nav2_controller
      exec: controller_server
      name: controller_server
      param:
        - from: $(var nav2_params)

  # ==================== Smoother Server ====================
  - node:
      pkg: nav2_smoother
      exec: smoother_server
      name: smoother_server
      param:
        - from: $(var nav2_params)

  # ==================== Behavior Server (recoveries) ====================
  - node:
      pkg: nav2_behaviors
      exec: behavior_server
      name: behavior_server
      param:
        - from: $(var nav2_params)

  # ==================== BT Navigator ====================
  - node:
      pkg: nav2_bt_navigator
      exec: bt_navigator
      name: bt_navigator
      param:
        - from: $(var nav2_params)

  # ==================== Waypoint Follower ====================
  - node:
      pkg: nav2_waypoint_follower
      exec: waypoint_follower
      name: waypoint_follower
      param:
        - from: $(var nav2_params)

  # ==================== Velocity Smoother ====================
  - node:
      pkg: nav2_velocity_smoother
      exec: velocity_smoother
      name: velocity_smoother
      param:
        - from: $(var nav2_params)

  # ==================== Lifecycle Manager ====================
  - node:
      pkg: nav2_lifecycle_manager
      exec: lifecycle_manager
      name: lifecycle_manager_navigation
      param:
        - name: use_sim_time
          value: $(var use_sim_time)
        - name: autostart
          value: true
        - name: node_names
          value:
            - 'map_server'
            - 'planner_server'
            - 'controller_server'
            - 'smoother_server'
            - 'behavior_server'
            - 'bt_navigator'
            - 'waypoint_follower'
            - 'velocity_smoother'



